<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexScribe — Loading</title>
<script>
    // Auth guard: redirect to landing if not logged in
    if (!sessionStorage.getItem('flexscribe_token')) {
        window.location.href = '../landing.html';
    }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #090B10;
    --card: #181D24;
    --border: #272D35;
    --orange: #FF8A34;
    --orange-glow: rgba(255, 138, 52, 0.25);
    --text: #F5F5F5;
    --text-light: #A3ABB8;
    --green: #B9F15B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* Ambient background glow */
.bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,138,52,0.08) 0%, transparent 65%);
    animation: pulse-glow 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}
@keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
}

/* Floating particles */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--orange);
    opacity: 0;
    animation: float-particle 4s ease-in-out infinite;
}
.particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
.particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 0.7s; }
.particle:nth-child(3) { left: 25%; top: 70%; animation-delay: 1.4s; }
.particle:nth-child(4) { left: 70%; top: 75%; animation-delay: 2.1s; }
.particle:nth-child(5) { left: 50%; top: 15%; animation-delay: 0.4s; }
.particle:nth-child(6) { left: 90%; top: 55%; animation-delay: 1.8s; }
.particle:nth-child(7) { left: 10%; top: 50%; animation-delay: 2.5s; }
.particle:nth-child(8) { left: 60%; top: 85%; animation-delay: 3.2s; }

@keyframes float-particle {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    25%  { opacity: 0.6; }
    50%  { opacity: 0.3; transform: translateY(-30px) scale(1); }
    75%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
}

/* Main container */
.loader-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    animation: fade-in 0.6s ease forwards;
}
@keyframes fade-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Logo */
.logo-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
}
.logo-wrap img {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    animation: logo-bounce 2s ease-in-out infinite;
}
@keyframes logo-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
}
.logo-text {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
}
.logo-text span { color: var(--orange); }

/* Spinner ring */
.spinner-wrap {
    position: relative;
    width: 80px;
    height: 80px;
}
.spinner-ring {
    position: absolute;
    inset: 0;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
.spinner-ring-inner {
    position: absolute;
    inset: 10px;
    border: 2.5px solid var(--border);
    border-bottom-color: var(--green);
    border-radius: 50%;
    animation: spin 1.5s linear infinite reverse;
}
.spinner-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--orange);
    border-radius: 50%;
    animation: dot-pulse 1.2s ease-in-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dot-pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50%      { transform: scale(1.2); opacity: 1; }
}

/* Progress bar */
.progress-wrap {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}
.progress-track {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--green));
    border-radius: 99px;
    transition: width 0.3s ease;
}
.progress-text {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 500;
}

/* Status messages */
.status-msg {
    font-size: 14px;
    color: var(--text-light);
    text-align: center;
    min-height: 20px;
    animation: fade-text 0.4s ease;
}
@keyframes fade-text {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Tip at bottom */
.tip {
    position: fixed;
    bottom: 32px;
    font-size: 12px;
    color: var(--text-light);
    opacity: 0.6;
    text-align: center;
    max-width: 320px;
    padding: 0 20px;
}
.tip strong { color: var(--orange); font-weight: 600; }

/* Exit animation */
.loader-container.exit {
    animation: fade-out 0.5s ease forwards;
}
@keyframes fade-out {
    to { opacity: 0; transform: translateY(-20px) scale(0.96); }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="loader-container" id="loader">
    <div class="logo-wrap">
        <img src="../images/smallLogo.png" alt="FlexScribe">
        <div class="logo-text">Flex<span>Scribe</span></div>
    </div>

    <div class="spinner-wrap">
        <div class="spinner-ring"></div>
        <div class="spinner-ring-inner"></div>
        <div class="spinner-dot"></div>
    </div>

    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0%</span>
    </div>

    <div class="status-msg" id="status-msg">Initialising your workspace...</div>
</div>

<div class="tip">
    <strong>Tip:</strong> You can track up to 5 subscriptions on the Free plan — upgrade anytime for unlimited.
</div>

<script>
'use strict';

(function() {
    const fill     = document.getElementById('progress-fill');
    const pctText  = document.getElementById('progress-text');
    const statusEl = document.getElementById('status-msg');
    const loader   = document.getElementById('loader');

    const messages = [
        { pct: 10,  text: 'Verifying your session...' },
        { pct: 25,  text: 'Loading your wallet...' },
        { pct: 40,  text: 'Fetching subscriptions...' },
        { pct: 55,  text: 'Syncing financial goals...' },
        { pct: 70,  text: 'Calculating Scribe Score...' },
        { pct: 85,  text: 'Preparing your dashboard...' },
        { pct: 95,  text: 'Almost there...' },
        { pct: 100, text: 'Welcome back! \u2728' },
    ];

    let currentStep = 0;

    function nextStep() {
        if (currentStep >= messages.length) {
            setTimeout(function() {
                loader.classList.add('exit');
                setTimeout(function() {
                    window.location.href = 'MASTER.html';
                }, 500);
            }, 600);
            return;
        }

        const step = messages[currentStep];
        fill.style.width = step.pct + '%';
        pctText.textContent = step.pct + '%';
        statusEl.textContent = step.text;
        statusEl.style.animation = 'none';
        void statusEl.offsetWidth;
        statusEl.style.animation = '';

        currentStep++;

        const delay = 250 + Math.random() * 300;
        setTimeout(nextStep, delay);
    }

    setTimeout(nextStep, 400);
})();
</script>
</body>
</html>
