# ═══════════════════════════════════════════════════════════
# FlexScribe Backend — Application Configuration
# ═══════════════════════════════════════════════════════════

# ── Server ──
server.port=8080

# ── SQL Server Database (Windows Authentication) ──
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=FlexScribeDB;encrypt=false;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# If using SQL Server Authentication instead, uncomment:
# spring.datasource.url=jdbc:sqlserver://localhost;databaseName=FlexScribeDB;encrypt=false;trustServerCertificate=true
# spring.datasource.username=your_username
# spring.datasource.password=your_password

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
app.jwt.secret=FlexScribe_JWT_Secret_Key_Change_In_Production_2025
app.jwt.expiration-ms=604800000

# ── CORS ──
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500

# ── Future: Scribe AI ──
# app.ai.enabled=false
# app.ai.api-key=

# ── Future: FlexTap ──
# app.flextap.enabled=false
