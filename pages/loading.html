<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlexScribe — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0B0C0F;
    --card: #101115;
    --border: rgba(255,255,255,0.055);
    --orange: #FF7A29;
    --orange-glow: rgba(255, 122, 41, 0.25);
    --text: #F2F1ED;
    --text-light: #94969D;
    --green: #6FDB8F;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
}

/* Ambient background glow */
.bg-glow {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,122,41,0.08) 0%, transparent 65%);
    animation: pulse-glow 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}
@keyframes pulse-glow {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
}

/* Floating particles */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--orange);
    opacity: 0;
    animation: float-particle 4s ease-in-out infinite;
}
.particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
.particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 0.7s; }
.particle:nth-child(3) { left: 25%; top: 70%; animation-delay: 1.4s; }
.particle:nth-child(4) { left: 70%; top: 75%; animation-delay: 2.1s; }
.particle:nth-child(5) { left: 50%; top: 15%; animation-delay: 0.4s; }
.particle:nth-child(6) { left: 90%; top: 55%; animation-delay: 1.8s; }
.particle:nth-child(7) { left: 10%; top: 50%; animation-delay: 2.5s; }
.particle:nth-child(8) { left: 60%; top: 85%; animation-delay: 3.2s; }

@keyframes float-particle {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    25%  { opacity: 0.6; }
    50%  { opacity: 0.3; transform: translateY(-30px) scale(1); }
    75%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
}

/* Main container */
.loader-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    animation: fade-in 0.6s ease forwards;
}
@keyframes fade-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Logo */
.logo-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
}
.logo-wrap img {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    animation: logo-bounce 2s ease-in-out infinite;
}
@keyframes logo-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
}
.logo-text {
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
}
.logo-text span { color: var(--orange); }

/* Spinner ring */
.spinner-wrap {
    position: relative;
    width: 80px;
    height: 80px;
}
.spinner-ring {
    position: absolute;
    inset: 0;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
.spinner-ring-inner {
    position: absolute;
    inset: 10px;
    border: 2.5px solid var(--border);
    border-bottom-color: var(--green);
    border-radius: 50%;
    animation: spin 1.5s linear infinite reverse;
}
.spinner-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    background: var(--orange);
    border-radius: 50%;
    animation: dot-pulse 1.2s ease-in-out infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dot-pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50%      { transform: scale(1.2); opacity: 1; }
}

/* Progress bar */
.progress-wrap {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}
.progress-track {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--orange), var(--green));
    border-radius: 99px;
    transition: width 0.3s ease;
}
.progress-text {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 500;
}

/* Status messages */
.status-msg {
    font-size: 14px;
    color: var(--text-light);
    text-align: center;
    min-height: 20px;
    animation: fade-text 0.4s ease;
}
@keyframes fade-text {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Tip at bottom */
.tip {
    position: fixed;
    bottom: 32px;
    font-size: 12px;
    color: var(--text-light);
    opacity: 0.6;
    text-align: center;
    max-width: 320px;
    padding: 0 20px;
}
.tip strong { color: var(--orange); font-weight: 600; }

/* Exit animation */
.loader-container.exit {
    animation: fade-out 0.5s ease forwards;
}
@keyframes fade-out {
    to { opacity: 0; transform: translateY(-20px) scale(0.96); }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="loader-container" id="loader">
    <div class="logo-wrap">
        <img src="../images/smallLogo.png" alt="FlexScribe">
        <div class="logo-text">Flex<span>Scribe</span></div>
    </div>

    <div class="spinner-wrap">
        <div class="spinner-ring"></div>
        <div class="spinner-ring-inner"></div>
        <div class="spinner-dot"></div>
    </div>

    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0%</span>
    </div>

    <div class="status-msg" id="status-msg">Initialising your workspace...</div>
</div>

<div class="tip">
    <strong>Tip:</strong> You can track up to 5 subscriptions on the Free plan — upgrade anytime for unlimited.
</div>

<!-- API client (needed so the loader can prefetch real data) -->
<script src="../scripts/api.js"></script>
<script>
'use strict';

/*
   Event-driven loader.
   - Guards for an auth token (bounces to login if missing).
   - Prefetches the real data the app needs (wallet, subscriptions,
     goals, unread notifications) and advances the progress bar as
     each request settles — so progress reflects actual readiness.
   - Warms the SPA page cache in sessionStorage so MASTER.html can
     reuse the already-fetched data instead of refetching.
   - Redirects to MASTER.html once everything has settled (with a
     safety timeout so a slow/failed request never traps the user).
*/
(function () {
    const fill     = document.getElementById('progress-fill');
    const pctText  = document.getElementById('progress-text');
    const statusEl = document.getElementById('status-msg');
    const loader   = document.getElementById('loader');

    const TOKEN_KEY = 'flexscribe_token';
    const APP_URL   = 'MASTER.html';
    const LOGIN_URL = 'login.html';
    const SAFETY_MS = 8000;   // never hang longer than this

    let done = false;

    /* ---- 1. Session guard ---- */
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (!token) {
        // No valid session — don't pretend to load, go back to login.
        window.location.replace(LOGIN_URL);
        return;
    }

    /* ---- progress helpers ---- */
    let shownPct = 0;
    function setStatus(text) {
        statusEl.textContent = text;
        statusEl.style.animation = 'none';
        void statusEl.offsetWidth;   // restart the fade-in animation
        statusEl.style.animation = '';
    }
    function setProgress(pct, text) {
        // Never let the bar go backwards.
        shownPct = Math.max(shownPct, Math.min(100, Math.round(pct)));
        fill.style.width = shownPct + '%';
        pctText.textContent = shownPct + '%';
        if (text) setStatus(text);
    }

    /* ---- 2. Define the real prefetch tasks ---- */
    // Each task runs a real API call, caches the result for the app,
    // and (whether it succeeds or fails) counts as "settled" so a
    // single failing endpoint can't block entry to the app.
    function cache(key, result) {
        try {
            if (result && result.success) {
                sessionStorage.setItem('flexscribe_prefetch_' + key, JSON.stringify(result.data));
            }
        } catch (e) { /* storage full / serialisation issue — non-fatal */ }
    }

    const tasks = [
        { text: 'Loading your wallet...',      run: () => API.Wallet.get().then(r => cache('wallet', r)) },
        { text: 'Fetching subscriptions...',   run: () => API.Subscriptions.getAll().then(r => cache('subscriptions', r)) },
        { text: 'Syncing financial goals...',  run: () => API.Goals.getAll().then(r => cache('goals', r)) },
        { text: 'Checking notifications...',   run: () => API.Notifications.getAll().then(r => cache('notifications', r)) },
    ];

    setProgress(8, 'Verifying your session...');

    /* ---- 3. Run tasks, advancing the bar as each settles ---- */
    const total = tasks.length;
    let settled = 0;

    function afterEach() {
        settled++;
        // Reserve the last 10% for the hand-off animation.
        const pct = 15 + Math.round((settled / total) * 75);
        // Show the NEXT task's label if there is one.
        const next = tasks[settled];
        setProgress(pct, next ? next.text : 'Preparing your dashboard...');
        if (settled >= total) finish();
    }

    setStatus(tasks[0].text);
    tasks.forEach(function (task) {
        // Guard each call so a throw doesn't stop the others.
        let p;
        try { p = task.run(); } catch (e) { p = Promise.resolve(); }
        Promise.resolve(p).catch(function () { /* ignore per-task errors */ })
            .then(afterEach);
    });

    /* ---- 4. Finish + hand off to the app ---- */
    function finish() {
        if (done) return;
        done = true;
        setProgress(100, 'Welcome back!');
        setTimeout(function () {
            loader.classList.add('exit');
            setTimeout(function () { window.location.href = APP_URL; }, 500);
        }, 500);
    }

    // Safety net: if the network stalls, proceed anyway after SAFETY_MS.
    setTimeout(finish, SAFETY_MS);
})();
</script>
</body>
</html>
