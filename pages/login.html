<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlexScribe - Login</title>

    <link rel="stylesheet" href="../styles/login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

    <i class="fa-solid fa-lock lock-icon"></i>

    <h2>Welcome to FlexScribe</h2>

    <p>Manage every subscription from one wallet.</p>

    <!-- ============================= -->
    <!-- Login / Register Switch -->
    <!-- ============================= -->

    <div class="login-switch">

        <button id="loginBtn" class="active">
            Sign In
        </button>

        <button id="registerBtn">
            Create Account
        </button>

    </div>

    <!-- ============================= -->
    <!-- SIGN IN FORM -->
    <!-- ============================= -->

    <div id="loginForm">

        <label>Email Address</label>

        <div class="input-group">

            <input
                    type="email"
                    placeholder="you@company.com">

        </div>

        <label>Password</label>

        <div class="input-group">

            <input
                    type="password"
                    placeholder="Enter your password">

        </div>

        <div class="remember">

            <div class="remember-left">

                <input
                        type="checkbox"
                        id="remember">

                <label for="remember">
                    Remember me
                </label>

            </div>

            <a href="#">
                Forgot Password?
            </a>

        </div>

        <button class="login-btn">

            Sign In

        </button>

    </div>

    <!-- ============================= -->
    <!-- CREATE ACCOUNT FORM -->
    <!-- ============================= -->

    <div id="registerForm" style="display:none;">

        <label>First Name</label>

        <div class="input-group">

            <input
                    type="text"
                    placeholder="John " required>

        </div>
 <label>Last Name</label>

        <div class="input-group">

            <input
                    type="text"
                    placeholder=" Smith" required>

        </div>

        <label>Email Address</label>

        <div class="input-group">

            <input
                    type="email"
                    placeholder="john@email.com" required>

        </div>

        <label>Password</label>

        <div class="input-group">

            <input
                    type="password"
                    placeholder="Create password" required>

        </div>

        <label>Confirm Password</label>

        <div class="input-group">

            <input
                    type="password"
                    placeholder="Confirm password" required>

        </div>

        <button class="login-btn">

            Create Account

        </button>

        <p class="success-message">

            🎉 Success! 500 Scribe Points will be awarded after registration.

        </p>

    </div>

    <!-- ============================= -->
    <!-- SOCIAL LOGIN -->
    <!-- ============================= -->
    <div class="divider">

        <span>OR CONTINUE WITH</span>

    </div>
    <div class="social-login">

        <button>

            <i class="fa-brands fa-google"></i>

            Google

        </button>

        <button>

            <i class="fa-brands fa-apple"></i>

            Apple

        </button>

    </div>

    <a class="back-home" href="index.html">

        ← Back to Home

    </a>

</div>
<p class="success-message">
<!--  JavaScript -->
    <script src="../scripts/login.js"></script>

</body>

</html>
